<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KMP Trade – Masala Products</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#fff8ed;
  color:#3b1d0b;
}

/* HEADER */
header{
  background:#7b170f;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  height:65px;
  width:auto;
  border-radius:50%;
}

header h1{
  color:white;
  font-size:24px;
  margin-left:10px;
}

/* BILLBOARD */
.billboard{
  width:100%;
  overflow:hidden;
  position:relative;
  background:#000;
}

.slider{
  display:flex;
  transition:transform .5s ease;
  touch-action:pan-y;
}

.slide{
  min-width:100%;
}

.slide img{
  width:100%;
  display:block;
  height:auto;
}

/* DOTS */
.dots{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}

.dot{
  width:10px;
  height:10px;
  background:white;
  border-radius:50%;
  opacity:.6;
}

.dot.active{
  opacity:1;
  transform:scale(1.3);
}

/* PRODUCTS */
.products{
  padding:30px 18px;
  text-align:center;
}

.products h2{
  color:#7b170f;
  margin-bottom:20px;
  font-size:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  max-width:1000px;
  margin:auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.card h3{
  color:#7b170f;
  margin:10px 0;
}

.card p{
  color:#555;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#25D366;
  color:white;
  padding:14px 20px;
  border-radius:50px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 4px 15px rgba(0,0,0,.25);
  z-index:2000;
}

/* FOOTER */
footer{
  background:#7b170f;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;">
    <img src="logo.png" class="logo" alt="KMP Trade Logo">
    <h1>KMP TRADE</h1>
  </div>
</header>


<!-- SWIPE BILLBOARD -->
<section class="billboard">

  <div class="slider" id="slider">

    <div class="slide">
      <img src="billboard-haldi.png" alt="KMP Trade Haldi">
    </div>

    <div class="slide">
      <img src="billboard-mirchi.png" alt="KMP Trade Mirchi">
    </div>

  </div>

  <div class="dots">
    <span class="dot active"></span>
    <span class="dot"></span>
  </div>

</section>


<!-- PRODUCTS -->
<section class="products">

  <h2>Our Masala Products</h2>

  <div class="cards">

    <div class="card">
      <h3>Haldi Powder</h3>
      <p>Pure & Aromatic Turmeric Powder</p>
    </div>

    <div class="card">
      <h3>Mirchi Powder</h3>
      <p>Rich Colour & Fiery Flavour</p>
    </div>

    <div class="card">
      <h3>Dhaniya Powder</h3>
      <p>Authentic Aroma & Traditional Taste</p>
    </div>

  </div>

</section>


<!-- WHATSAPP -->
<a class="whatsapp"
   href="https://wa.me/917099759754"
   target="_blank">
   WhatsApp Us
</a>


<footer>
  <h3>KMP TRADE</h3>
  <p>Masala Products • Authentic & Flavourful</p>
  <p>Swad Jo Rahe Yaad!</p>
</footer>


<script>

let currentSlide = 0;
const slider = document.getElementById("slider");
const dots = document.querySelectorAll(".dot");

function showSlide(index){

  currentSlide = index;

  slider.style.transform =
    "translateX(-" + (currentSlide * 100) + "%)";

  dots.forEach((dot,i)=>{
    dot.classList.toggle("active",i === currentSlide);
  });
}

/* AUTO SWIPE */
setInterval(()=>{
  currentSlide++;

  if(currentSlide >= 2){
    currentSlide = 0;
  }

  showSlide(currentSlide);

},4000);


/* TOUCH SWIPE */
let startX = 0;

slider.addEventListener("touchstart",(e)=>{
  startX = e.touches[0].clientX;
});

slider.addEventListener("touchend",(e)=>{

  let endX = e.changedTouches[0].clientX;
  let difference = startX - endX;

  if(Math.abs(difference) > 50){

    if(difference > 0){
      currentSlide++;
      if(currentSlide >= 2) currentSlide = 0;
    }else{
      currentSlide--;
      if(currentSlide < 0) currentSlide = 1;
    }

    showSlide(currentSlide);
  }

});

</script>

</body>
</html>
